# .github/workflows/ci.yml — 검증 (비밀값 필요 없음)
#
# 동작 시점: pull_request · main·develop push · Deploy 워크플로의 호출(workflow_call)
# 공개/비공개와 무관하게 PR 에 붙여두면 병합 전에 잡힌다.
#
# ⚠️ 이 워크플로는 Secret 이 하나도 필요 없다. 그대로 켜서 쓸 수 있다.
#
# ℹ️ 계약 테스트(test:contract)는 여기서 돌리지 않는다.
#    도메인 구현 전에는 8초록/41빨강이 정상인 "진행 척도"라서 CI 를 항상 빨갛게 만든다.
#    구현하며 초록을 늘려갈 때 로컬에서 `pnpm test:contract` 로 확인하면 된다.
name: CI

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_call:

# 같은 브랜치에 push 가 몰리면 이전 실행을 취소한다
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: docthru
          POSTGRES_PASSWORD: docthru
          POSTGRES_DB: docthru_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U docthru -d docthru_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # pnpm-lock.yaml 이 저장소에 있으므로 frozen 으로 정확히 재현한다.
      # (lockfile 이 없으면 이 단계는 캐시 미스로 먼저 실패한다)
      - name: Install
        run: pnpm install --frozen-lockfile

      # Prisma 8: 생성된 클라이언트 대신 contract.json 을 쓴다.
      #   emit 은 계약 원본(contract.prisma)과 커밋된 contract.json 의 드리프트 점검도 겸한다.
      - name: Prisma contract emit
        run: pnpm exec prisma contract emit

      # Prisma 8: 빈 DB 에 계약의 테이블을 만든다 (v7 의 `migrate deploy` 자리).
      #   CI 의 테스트용 DB 는 매번 새로 뜨므로 init 이 맞다.
      - name: Database init
        env:
          DATABASE_URL: postgresql://docthru:docthru@localhost:5432/docthru_test
          NODE_ENV: test
        run: pnpm exec prisma db init

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Test
        env:
          DATABASE_URL: postgresql://docthru:docthru@localhost:5432/docthru_test
          NODE_ENV: test
          JWT_ACCESS_SECRET: ci-only-access-secret-at-least-32-characters
          JWT_REFRESH_SECRET: ci-only-refresh-secret-at-least-32-characters
        run: pnpm test

      # 이미지 자체가 올라가는지 확인한다 (배포 실패를 미리 잡는 용도)
      #   Dockerfile 은 레거시 빌더에서도 돌아가도록 작성했지만, BuildKit 을 명시해 두면 더 안전해요.
      - name: Build image
        env:
          DOCKER_BUILDKIT: '1'
        run: docker build -t docthru-backend:ci .
