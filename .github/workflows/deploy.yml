# .github/workflows/deploy.yml — GCP Cloud Run 수동 배포 (백엔드 단독 repo)
#
# ─────────────────────────────────────────────────────────────
#  ⚠️ 이 워크플로는 **예비(수동) 배포 경로**입니다.
#     공식 자동 배포는 **Cloud Build + cloudbuild.yaml** 가 담당해요.
#     (main push → 자동 빌드·배포, 그리고 배포 주소가 repo 안에서 버전 관리돼요)
#     이 워크플로는 ① Cloud Build 가 막혔을 때 ② 지금 당장 수동으로 배포할 때
#     ③ 스키마 마이그레이션까지 함께 돌릴 때 사용합니다.
#     어느 쪽이든 배포 전에 CI를 먼저 통과합니다 (`needs: ci`).
# ─────────────────────────────────────────────────────────────
#
#  1회성 준비 (계정 작업 — 자동화할 수 없다)
#   ① GCP 프로젝트 생성 + 과금 계정 연결
#   ② API 활성화: run.googleapis.com · artifactregistry.googleapis.com
#   ③ Artifact Registry 저장소 생성 (docker)
#   ④ 서비스 계정 생성 (Cloud Run Developer + Artifact Registry Reader)
#   ⑤ Workload Identity Federation 연결 생성
#   ⑥ 저장소 Settings → Actions → General → Workflow permissions 확인
#
#  Variables (Settings → Secrets and variables → Actions → Variables)
#    GCP_PROJECT_ID
#    GCP_REGION                      예) asia-northeast2
#    GCP_ARTIFACT_REPOSITORY         예) docthru
#    GCP_SERVICE_ACCOUNT             예) docthru-deployer@PROJECT.iam.gserviceaccount.com
#    GCP_WORKLOAD_IDENTITY_PROVIDER  예) projects/123/.../providers/github-repo
#    CLIENT_BASE_URL                 프론트 주소 (CORS 허용 대상)
#    BACKEND_BASE_URL               ★ 첫 배포 후 등록 — 이 서비스의 공개 URL + /api/v1
#                                      (OAuth 콜백 주소를 만들 때 쓰인다)
#
#  Secrets
#    DATABASE_URL            Supabase Session pooler (포트 5432)
#    JWT_ACCESS_SECRET       openssl rand -base64 48
#    JWT_REFRESH_SECRET      openssl rand -base64 48
#    OAUTH_STATE_SECRET      (소셜 로그인 사용 시)
#
#  ⚠️ service account JSON 키는 넣지 않는다. WIF 로 키 없이 인증한다.
#
#  비용 안전장치
#   · --max-instances 로 상한을 둔다 (아래 max_instances).
#   · ENABLE_DEV_LOGIN 은 등록하지 않는다. 기본 false → 라우트 자체가 없다.
name: Deploy

on:
  # ⚠️ Variables·Secrets 등록을 마치면 아래 주석을 해제하세요.
  # push:
  #   branches: [main, develop]
  # Supabase Free 는 7일간 저활동이면 정지된다 → 하루 한 번 인증이 필요한 경로를 호출해 깨운다.
  # (BACKEND_BASE_URL 이 비어 있으면 조용히 건너뛴다)
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # WIF 토큰 요청에 필요

jobs:
  ci:
    name: CI 검증
    # 수동 배포와 (나중에 켤) push 자동배포 모두 CI를 먼저 통과한다.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/ci.yml

  keepalive:
    name: Supabase keep-alive
    # 스케줄 트리거일 때만 실행한다.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: 인증이 필요한 엔드포인트를 호출해 DB 를 깨운다
        env:
          BACKEND_BASE_URL: ${{ vars.BACKEND_BASE_URL }}
        run: |
          if [ -z "$BACKEND_BASE_URL" ]; then
            echo "BACKEND_BASE_URL 변수가 아직 없어 건너뜁니다."
            exit 0
          fi
          curl -fsS -o /dev/null -w "keepalive: HTTP %{http_code}\n" \
            "${BACKEND_BASE_URL}/challenges?size=1" || echo "keepalive 실패 (무시)"

  migrate:
    name: DB 마이그레이션
    # CI가 초록불일 때만 DB 마이그레이션을 실행한다.
    needs: ci
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Prisma 8: 계약 원본에서 contract.json 을 만든다 (v7 의 `prisma generate` 자리)
      - run: pnpm exec prisma contract emit

      # ⚠️ 이미지 안에서 돌리지 않고 파이프라인 단계로 뺀다.
      #    인스턴스가 동시에 떠 있으면 마이그레이션 락이 경합한다.
      - name: prisma db migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm exec prisma db migrate

  deploy:
    name: 백엔드 배포
    # CI와 DB 마이그레이션이 모두 성공해야 배포한다.
    needs: [ci, migrate]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: docker/setup-buildx-action@v3

      - name: Artifact Registry 로그인
        run: |
          gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: 이미지 빌드 · 푸시
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPOSITORY }}/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Cloud Run 배포
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: docthru-be
          image: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPOSITORY }}/backend:${{ github.sha }}
          region: ${{ vars.GCP_REGION }}
          # ⚠️ 무료 티어인데 상한을 걸어야 유입 시 과금이 막힌다
          max_instances: 3
          min_instances: 0
          timeout: 300
          cpu: 1
          memory: 512Mi
          env_vars: |
            NODE_ENV=production
            DB_POOL_MAX=5
            CLIENT_BASE_URL=${{ vars.CLIENT_BASE_URL }}
            CORS_ORIGINS=${{ vars.CLIENT_BASE_URL }}
            API_BASE_URL=${{ vars.BACKEND_BASE_URL }}
          secrets: |
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            JWT_ACCESS_SECRET=${{ secrets.JWT_ACCESS_SECRET }}
            JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET }}
            OAUTH_STATE_SECRET=${{ secrets.OAUTH_STATE_SECRET }}

      - name: 배포 결과 출력
        run: |
          echo "백엔드 URL: ${{ steps.deploy.outputs.url }}"
          echo "→ GitHub 변수 BACKEND_BASE_URL 에 '${{ steps.deploy.outputs.url }}/api/v1' 를 등록하세요."
